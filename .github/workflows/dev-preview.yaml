name: Build & Deploy GDevelop newIDE to GitHub Pages
 
on:
  push:
    branches:
      - master
  workflow_dispatch: # allows manual trigger from any branch (useful for testing)
 
# Required for the modern GitHub Pages deployment API
permissions:
  contents: read
  pages: write
  id-token: write
 
# Only allow one deployment at a time; cancel in-flight runs on new push
concurrency:
  group: pages
  cancel-in-progress: true
 
jobs:
  build:
    name: Build newIDE/app
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: newIDE/app/package-lock.json
 
      - name: Install dependencies
        working-directory: newIDE/app
        run: npm ci
 
      - name: Build production bundle
        working-directory: newIDE/app
        env:
          # Prevents create-react-app from treating warnings as errors
          CI: false
          # GDevelop's webpack build is heavy — give Node.js extra heap space
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
 
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4
 
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: newIDE/app/build
 
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
